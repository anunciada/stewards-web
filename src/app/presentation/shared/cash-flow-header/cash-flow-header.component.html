<div class="bg-green-800 text-white p-4">
  <div class="flex flex-col md:flex-row md:justify-between md:items-center gap-4">
    <div>
      <h1 class="text-xl font-semibold">
        Fluxo de Caixa {{ userName | uppercase }}
      </h1>
      <p class="text-sm opacity-80">
        Controle financeiro de entradas e saídas
      </p>
    </div>

    <div class="grid grid-cols-2 md:flex gap-3">
      <!-- PERÍODO -->
      <div>
        <label class="text-xs block mb-1">Período</label>
        <select [(ngModel)]="selectedPeriod" (change)="applyFilters()" class="w-full text-black px-3 py-2 rounded">
          <option value="all">Todos os meses</option>
          <option value="3">Últimos 3 meses</option>
          <option value="6">Últimos 6 meses</option>
          <option value="12">Últimos 12 meses</option>
        </select>
      </div>

      <!-- MÊS -->
      <div>
        <label class="text-xs block mb-1">Mês</label>
        <select [(ngModel)]="selectedMonth" (change)="applyFilters()" class="w-full text-black px-3 py-2 rounded">
          <option value="">Todos</option>
          <option *ngFor="let m of availableMonths; let i = index" [value]="i">
            {{ m }}
          </option>
        </select>
      </div>

      <!-- ANO -->
      <div>
        <label class="text-xs block mb-1">Ano</label>
        <input type="text" maxlength="2" [(ngModel)]="selectedYear" (input)="onYearChange()"
          class="w-full text-black px-3 py-2 rounded" />
      </div>

      <div class="flex items-end">
        <button class="text-sm">
          Sair
        </button>
      </div>
    </div>
  </div>
</div>
