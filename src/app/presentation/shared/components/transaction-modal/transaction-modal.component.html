<div class="bg-white rounded-xl w-full max-w-lg p-6 shadow-lg">

  <!-- HEADER -->
  <div class="flex justify-between items-center mb-4">
    <h2 class="text-lg font-semibold">Nova Movimentação</h2>
    <button (click)="closeTransactionModal()">✕</button>
  </div>

  <!-- TYPE -->
  <div class="flex gap-2 mb-6">

    <button (click)="selectTransactionType('entrada')" [class.bg-green-100]="isTransactionTypeSelected('entrada')"
      [class.border-green-300]="isTransactionTypeSelected('entrada')" class="flex-1 border rounded-lg p-3">
      ↑ Entrada
    </button>

    <button (click)="selectTransactionType('saida')" [class.bg-red-100]="isTransactionTypeSelected('saida')"
      [class.border-red-300]="isTransactionTypeSelected('saida')" class="flex-1 border rounded-lg p-3">
      ↓ Saída
    </button>

  </div>

  <!-- CATEGORY -->
  <div class="mb-4">
    <div class="flex justify-between items-center mb-2">
      <p class="text-sm">Categoria *</p>

      <button *ngIf="!isCreatingCategory" (click)="showCreateCategory()"
        class="w-5 h-5 bg-green-600 text-white rounded flex items-center justify-center">
        +
      </button>

      <button *ngIf="isCreatingCategory" (click)="cancelCreateCategory()"
        class="w-5 h-5 bg-red-600 text-white rounded flex items-center justify-center">
        ×
      </button>

    </div>

    <!-- C. SELECT -->
    <div *ngIf="!isCreatingCategory">
      <select class="w-full text-black px-3 py-2 rounded border">
        <option *ngFor="let c of availableCategories">
          {{ c }}
        </option>
      </select>
    </div>

    <!-- C. INPUT + SAVE -->
    <div *ngIf="isCreatingCategory" class="flex gap-2">
      <input [(ngModel)]="newCategory" placeholder="Nova categoria" class="flex-1 px-3 py-2 rounded border" />

      <button (click)="saveCategory()" class="px-4 py-2 bg-green-600 text-white rounded">
        Salvar
      </button>
    </div>
  </div>

  <!-- DESCRIPTION -->
  <input class="w-full border rounded-lg p-2 mb-4" placeholder="Descrição" />

  <!-- VALUE + DATE -->
  <div class="flex gap-2 mb-4">
    <input class="flex-1 border rounded-lg p-2" placeholder="Valor *" />
    <input class="flex-1 border rounded-lg p-2" type="date" />
  </div>

  <!-- ACTIONS -->
  <div class="flex justify-end gap-2">
    <button (click)="closeTransactionModal()" class="px-4 py-2 border rounded-lg">
      Cancelar
    </button>

    <button class="px-4 py-2 bg-green-600 text-white rounded-lg">
      Adicionar
    </button>
  </div>

</div>
